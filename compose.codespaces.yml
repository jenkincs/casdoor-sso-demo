services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: casdoor_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run the startup script first}
      POSTGRES_DB: casdoor
    volumes:
      - ./.demo/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casdoor_owner -d casdoor"]
      interval: 5s
      timeout: 5s
      retries: 30
  casdoor:
    build:
      context: .
      dockerfile: casdoor/Dockerfile
    restart: unless-stopped
    env_file: .demo/runtime.env
    environment:
      PORT: "8000"
    ports: ["8000:8000"]
    volumes:
      - ./.demo/casdoor:/data
    depends_on:
      postgres:
        condition: service_healthy
  booking:
    build:
      context: .
      dockerfile: booking/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      CASDOOR_URL: ${CASDOOR_URL}
      PUBLIC_URL: ${BOOKING_URL}
      OTHER_APP_URL: ${INVOICE_URL}
      CLIENT_ID: sso-booking
      CLIENT_SECRET: ${BOOKING_CLIENT_SECRET}
      COOKIE_SECURE: "true"
    ports: ["8080:8080"]
  invoice:
    build:
      context: .
      dockerfile: invoice/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8081"
      NODE_ENV: production
      CASDOOR_URL: ${CASDOOR_URL}
      PUBLIC_URL: ${INVOICE_URL}
      OTHER_APP_URL: ${BOOKING_URL}
      CLIENT_ID: sso-invoice
      CLIENT_SECRET: ${INVOICE_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
    ports: ["8081:8081"]
